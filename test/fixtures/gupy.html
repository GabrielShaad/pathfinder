ão e evolução de campanhas e jornadas no Salesforce Marketing Cloud Engagement (SFMC Engagement clássico).O foco é executar e sustentar comunicações para públicos segmentados, com uso intensivo de automações, queries SQL funcionais, jornadas e Custom Activities já utilizadas pelo cliente.Espera-se autonomia compatível com nível Pleno para esclarecer requisitos, executar e validar entregas, comunicar riscos e manter o cliente informado.Esta é uma posição hands-on, orientada à operação confiável e à qualidade das comunicações.\n\n\n\nResponsabilidades e atribuições\nAlinhamento com o cliente: entender e confirmar as demandas (objetivo, público, canal, conteúdo, critérios de aceite, prazo e dependências) antes de executar.Campanhas: configurar, disparar e acompanhar campanhas de e-mail e, conforme os canais habilitados, SMS, Push e WhatsApp no SFMC Engagement.Automações: criar, manter e monitorar automações no Automation Studio, incluindo importação de arquivos, atualização de Data Extensions e execução de queries.Segmentação com SQL: criar e validar queries para segmentar e preparar públicos, conferindo volumes, chaves, duplicidades e regras de inclusão/exclusão antes dos disparos.Jornadas: operar jornadas no Journey Builder (entradas, critérios de saída, Decision Splits, Engagement Splits e Custom Activities já disponíveis).Dados e consentimento: preparar os dados das jornadas e comunicações multicanal, respeitando elegibilidade, preferências e consentimento.Personalização: usar AMPscript para conteúdo dinâmico e lógica condicional, e SSJS em nível básico para manutenção e tarefas pontuais, pedindo revisão em casos críticos ou complexos.Qualidade e testes: validar público, supressões, conteúdo, links, renderização e volumes antes de ativar qualquer envio.Diagnóstico de falhas: investigar problemas em automações, queries, jornadas e disparos, identificando causa provável, impacto e próximos passos, registrando incidentes e escalando quando necessário.Resultados: acompanhar e reportar indicadores (enviados, entregues, bounces, cliques, descadastros e erros) com contexto, sem usar taxa de abertura como único critério de sucesso.Documentação: manter registro funcional e técnico das entregas (segmentações, dependências, sequência das automações e validações feitas).Melhoria contínua: propor melhorias incrementais na operação, com estimativa de impacto, validando com o cliente e a gestão técnica da Just Solutions.Trabalho em equipe: atuar de forma coordenada com as equipes do cliente e da Just Solutions, respeitando aprovações, gestão de mudanças e calendário de comunicação.\n\nRequisitos e qualificações\nSFMC Engagement: experiência prática com Marketing Cloud Engagement clássico, especialmente Email Studio, Content Builder, Automation Studio e Journey Builder.Jornadas e automações: experiência na construção e manutenção de jornadas e automações que disparam comunicações para públicos segmentados.Custom Activities: experiência operacional com Custom Activities já configuradas na conta (entender parâmetros, preparar dados, configurar na jornada e validar resultados). Não é necessário desenvolvê-las nem gerir o Extension SDK.SQL: boa experiência com SQL no SFMC (SELECT, JOIN, WHERE, CASE, GROUP BY), em Data Extensions e Data Views, com capacidade de escrever, otimizar e testar queries de segmentação.SOQL: bom conhecimento para consultar objetos Salesforce e validar dados vindos de integrações com o CRM, entendendo as diferenças em relação ao SQL das Query Activities. Não se espera que o SOQL substitua as queries da operação.Estrutura de dados: conhecimento de Data Extensions, Subscriber/Contact, Contact Key, chaves primárias, relacionamentos básicos e deduplicação, e dos impactos disso em segmentação e envio.AMPscript: conhecimento sólido para personalização e lógica de conteúdo em e-mails e, quando aplicável, CloudPages, com capacidade de testar lookups, condições e cenários com dados ausentes ou inesperados.E-mail e entregabilidade: conhecimento de boas práticas de envio, Sender Profile, Delivery Profile, Send Classification, SPF, DKIM e DMARC.Consentimento e governança: noções de opt-in/opt-out, listas de publicação, supressão e preferências por canal, seguindo as regras do cliente.Testes e análise: capacidade de testar entregas, analisar resultados e comunicar problemas de forma objetiva.Perfil: boa comunicação escrita e verbal, organização, atenção ao detalhe e facilidade para trabalhar diretamente com o cliente em contexto de outsourcing.DiferenciaisCertificação Salesforce Marketing Cloud Engagement Email Specialist, Administrator, Developer ou Consultant.Experiência com Mobile Studio e canais de SMS, Push ou WhatsApp em SFMC Engagement.Experiência com CloudPages e manutenção de landing pages com AMPscript ou SSJS.Experiência com Data Views, relatórios operacionais e análise de entregabilidade.Familiaridade com gestão de versões, ambientes, aprovações e promoção de alterações entre ambientes.Inglês técnico para leitura de documentação Salesforce.Competências comportamentaisPerfil hands-on e responsável pela qualidade da execução.Comunicação clara com cliente e equipa, incluindo a capacidade de confirmar requisitos e sinalizar riscos ou impedimentos com antecedência.Autonomia para gerir tarefas recorrentes e resolver problemas conhecidos, sabendo quando solicitar apoio.Raciocínio analítico e atenção à consistência dos dados, critérios de segmentação e impactos sobre os públicos.Organização para acompanhar demandas simultâneas, prazos, aprovações e dependências.Colaboração, abertura a feedback e compromisso com documentação e melhoria contínua.\n\nInformações adicionaisModelo de contratação: PJ&nbsp;Tipo de CNPJ/Empresa: ME (microempresa) ou LTDA (Empresa de Responsabilidade Limitada)Com plano abrangente de benefícios:💻 Notebook da empresa para quem está em SP, ou 💸 auxílio infraestrutura para garantia de internet e insumos para a realização do trabalho, para quem está fora de SP.🤑13ª nota n
